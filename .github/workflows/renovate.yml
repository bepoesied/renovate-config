name: Renovate Self-Hosted

on:
  schedule:
    - cron: "43 */4 * * *"
  workflow_dispatch:
    inputs:
      log-level:
        description: Log level for Renovate
        type: choice
        options:
          - info
          - debug
        default: info
      dry-run:
        description: Dry run mode for Renovate
        type: choice
        options:
          - none
          - lookup
          - full
        default: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    environment:
      name: renovate
      deployment: false
    steps:
      - name: Generate GitHub App token
        id: get-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          token: ${{ steps.get-token.outputs.token }}
          persist-credentials: false

      - name: Configure dry-run mode
        if: ${{ inputs.dry-run == 'lookup' || inputs.dry-run == 'full' }}
        env:
          DRY_RUN_MODE: ${{ inputs.dry-run }}
        run: echo "RENOVATE_DRY_RUN=${DRY_RUN_MODE}" >> "$GITHUB_ENV"

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ steps.get-token.outputs.token }}
          configurationFile: ./renovate-config.json
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          RENOVATE_PLATFORM_COMMIT: enabled
